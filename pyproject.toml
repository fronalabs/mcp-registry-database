[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-registry-database"
version = "0.1.0"
description = "Prebuilt, GitHub-stars-enriched MCP registry snapshots."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "httpx-retries>=0.4",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
